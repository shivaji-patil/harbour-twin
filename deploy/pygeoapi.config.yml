# OGC API - Features and Tiles over the twin's vector products, served by pygeoapi.
# Each collection reads one layer of data/<aoi>/features.gpkg (written by `twin <aoi> package`).
server:
  bind:
    host: 0.0.0.0
    port: 80
  url: http://localhost:5000
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  languages: [en-US]
  limits:
    default_items: 50
    max_items: 2000
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'

logging:
  level: ERROR

metadata:
  identification:
    title:
      en: Harbour Twin OGC API
    description:
      en: Buildings with lidar-measured heights, AIS vessel tracks and Sentinel-1 ship detections for Vancouver and St. John's harbours, built from public data.
    keywords:
      en: [digital twin, buildings, lidar, AIS, SAR, harbour]
    keywords_type: theme
    terms_of_service: https://drive.google.com/drive/folders/1G1-Gydt87UOtE5QmMSwFA0a0zaSUFRKa
    url: https://drive.google.com/drive/folders/1G1-Gydt87UOtE5QmMSwFA0a0zaSUFRKa
  license:
    name: Per source (ODbL, CC BY 4.0, OGL-Canada)
    url: https://drive.google.com/drive/folders/1G1-Gydt87UOtE5QmMSwFA0a0zaSUFRKa
  provider:
    name: Harbour Twin
    url: https://drive.google.com/drive/folders/1G1-Gydt87UOtE5QmMSwFA0a0zaSUFRKa
  contact:
    name: Patil, Shivaji
    url: https://drive.google.com/drive/folders/1G1-Gydt87UOtE5QmMSwFA0a0zaSUFRKa

resources:
  vancouver-buildings:
    type: collection
    title: Vancouver buildings
    description: Overture footprints with lidar-measured heights (DSM - DTM), ground, roof and flood levels in CGVD2013, and QC flags.
    keywords: [buildings, lidar, heights]
    extents:
      spatial:
        bbox: [-123.150, 49.272, -123.075, 49.318]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: OGR
        data:
          source_type: GPKG
          source: /data/vancouver/features.gpkg
        id_field: id
        layer: buildings
      - type: tile  # OGC API - Tiles: vector tiles made by deploy/tiles.sh (tippecanoe)
        name: MVT-tippecanoe
        data: /data/vancouver/vtiles/buildings
        options:
          zoom:
            min: 12
            max: 16
          schemes: [WebMercatorQuad]
        format:
          name: pbf
          mimetype: application/vnd.mapbox-vector-tile

  vancouver-ais-tracks:
    type: collection
    title: Vancouver AIS tracks
    description: Cleaned vessel track segments from a 4-hour live aisstream.io capture (21 Oct 2026).
    keywords: [AIS, vessels, tracks]
    extents:
      spatial:
        bbox: [-123.400, 49.200, -122.900, 49.360]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: OGR
        data:
          source_type: GPKG
          source: /data/vancouver/features.gpkg
        id_field: feature_id
        layer: ais_tracks

  vancouver-ais-positions:
    type: collection
    title: Vancouver AIS positions
    description: Cleaned AIS position reports with speed, course, ship type and destination.
    keywords: [AIS, vessels]
    extents:
      spatial:
        bbox: [-123.400, 49.200, -122.900, 49.360]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: OGR
        data:
          source_type: GPKG
          source: /data/vancouver/features.gpkg
        id_field: feature_id
        layer: ais_positions

  vancouver-sar-detections:
    type: collection
    title: Vancouver Sentinel-1 ship detections
    description: CFAR ship targets in Sentinel-1 backscatter, with their AIS cross-check status.
    keywords: [SAR, Sentinel-1, ships, dark vessels]
    extents:
      spatial:
        bbox: [-123.400, 49.200, -122.900, 49.360]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: OGR
        data:
          source_type: GPKG
          source: /data/vancouver/features.gpkg
        id_field: feature_id
        layer: sar_detections

  stjohns-buildings:
    type: collection
    title: St. John's buildings
    description: Overture footprints with lidar-measured heights and flood levels in CGVD2013.
    keywords: [buildings, lidar, heights]
    extents:
      spatial:
        bbox: [-52.735, 47.548, -52.670, 47.580]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: OGR
        data:
          source_type: GPKG
          source: /data/stjohns/features.gpkg
        id_field: id
        layer: buildings
      - type: tile  # OGC API - Tiles: vector tiles made by deploy/tiles.sh (tippecanoe)
        name: MVT-tippecanoe
        data: /data/stjohns/vtiles/buildings
        options:
          zoom:
            min: 12
            max: 16
          schemes: [WebMercatorQuad]
        format:
          name: pbf
          mimetype: application/vnd.mapbox-vector-tile

  stjohns-sar-detections:
    type: collection
    title: St. John's Sentinel-1 ship detections
    description: CFAR ship targets in Sentinel-1 HH/HV backscatter off St. John's.
    keywords: [SAR, Sentinel-1, ships]
    extents:
      spatial:
        bbox: [-52.850, 47.450, -52.550, 47.700]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        name: OGR
        data:
          source_type: GPKG
          source: /data/stjohns/features.gpkg
        id_field: feature_id
        layer: sar_detections
